plugins { id 'com.android.application' }

android {
    namespace 'com.rvc.mnn'
    compileSdk 34

    defaultConfig {
        applicationId "com.rvc.mnn"
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName "0.2-rec"
        ndkVersion '29.0.14206865'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17 -O3"
            }
        }
    }
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // 模型已压缩不了，保持不压缩：APK 体积不变，解压时是直接拷贝，不用边解压边读
    androidResources {
        noCompress += ['mnn', 'onnx', 'bin']
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    // Material 3（官方 views 组件库）：主题/按钮/滑块/弹窗/输入框全套 M3
    implementation 'com.google.android.material:material:1.12.0'
    // 本地 AAR：SILK 编解码 + root/Shizuku 覆写 QQ 语音草稿（纯能力库，零组件）
    implementation(name: 'silkq', ext: 'aar')
}
